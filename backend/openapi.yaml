openapi: 3.0.3
info:
  version: "1"
  title: "Group 3"
  description: "Group 3 Project V1"
tags: 
  - name: user
    description: all endpoints related to user management

paths:
  /user/{userId}:
    get:
      
      tags:
        - user
      operationId: "getUserById"
      description: ""
      parameters:
        - in: "path"
          name: "userId"
          required: true
          schema:
            type: "string"
      responses:
        200:
          description: "The user with the queried user ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user"
        401:
          description: "Unauthorized"
        404:
          description: "An error if the user does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        500:
          description: "Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      
      tags:
        - user
      operationId: "updateUser"
      description: ""
      parameters:
        - in: "path"
          name: "userId"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/user"
      responses:
        200:
          description: "The User was successfully updated"
          content:
            application/json:
              schema:
                type: "string"
        401:
          description: "Unauthorized"
    delete:
      
      tags:
        - user
      operationId: "deleteUser"
      description: ""
      parameters:
        - in: "path"
          name: "userId"
          required: true
          schema:
            type: "string"
      responses:
        204:
          description: "A notification that the object was deleted successfully "
          content:
            application/json:
              schema:
                type: "string"
        401:
          description: "Unauthorized"
  /user/login:
    get:
      tags:
      - user
      operationId: "loginUser"
      description: ""
      parameters:
        - in: "query"
          name: "username"
          required: true
          schema:
            type: "string"
        - in: "query"
          name: "password"
          required: true
          schema:
            type: "string"
      responses:
        200:
          description: "The user with the queried user ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user"
        401:
          description: "Unauthorized"
        404:
          description: "An error if the user does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        500:
          description: "Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /user/logout:
    get:
      tags:
      - user
      operationId: "logoutUser"
      description: ""
      responses:
        200:
          description: "The current user"
  /user:
    post:
      
      tags:
        - user
      operationId: "createUser"
      description: ""
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/user"
      responses:
        201:
          description: "User Created Successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user"
        401:
          description: "Unauthorized"
        500:
          description: "There was an error in the processing of this request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes: 
      JWTBearer:
        type: http
        scheme: bearer
        bearerFormat: JWT

  schemas:
    user:
      properties:
        UserId:
          nullable: false
          type: "integer"
          example: 12345
        Email:
          nullable: false
          type: "string"
          example: john@example.com
        Country:
          nullable: false
          type: "string"
          example: CA
        Language:
          nullable: false
          type: "string"
          example: EN-CA
        CreationDate:
          nullable: false
          type: "integer"
          example: 1717182132
        ProfilePicture:
          nullable: false
          type: "string"
          format: "binary"
          example: 11110000
        Username:
          nullable: false
          type: "string"
          example: John123
        Role:
          nullable: false
          type: "string"
          example: Admin, Member, Staff
    Error:
      properties:
        code:
          nullable: false
          type: "integer"
          example: 500
        description:
          nullable: false
          type: "string"
          example: "Internal Server Error"
security:
  - JWTBearer:
      - read:user
      - write:user
